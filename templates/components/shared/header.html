<nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand app-brand" href="{{ url_for(current_user.role.value.lower() + '.dashboard') }}">
            <i class="bi bi-signpost-split-fill me-2"></i>TrekFlow
        </a>

        <div class="collapse navbar-collapse" id="navbarContent">
            {% if current_user.role.name == 'ADMIN' %}
            <form class="admin-header-search mx-auto" method="GET" action="{{ url_for('admin.search') }}" role="search">
                <label class="visually-hidden" for="admin-search">Search TrekFlow</label>
                <div class="input-group">
                    <input class="form-control" id="admin-search" name="q" type="search" value="{{ request.args.get('q', '') if request.endpoint == 'admin.search' else '' }}" placeholder="Search treks, staff, trekkers" required>
                    <button class="btn btn-outline-primary" type="submit" aria-label="Search"><i class="bi bi-search"></i></button>
                </div>
            </form>
            {% endif %}
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link app-user-link d-flex align-items-center gap-2" href="{{ url_for('shared.profile') }}">
                        <span class="user-avatar">{{ current_user.first_name[0] }}{{ current_user.last_name[0] }}</span>
                        <span>
                            <span class="d-block fw-semibold">{{ current_user.first_name }} {{ current_user.last_name }}</span>
                            <small class="text-muted">{{ current_user.role.value }}</small>
                        </span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
