<aside class="p-3 bg-light sidebar" style="width: 200px; height: calc(100vh - 56px);">
    <div class="d-flex flex-column align-items-start gap-2">
        <div class="w-100 py-2 px-3 {% if tab == 'dashboard' %}active{% endif %}">
            <a class="nav-link primary" href="{{ url_for('trekker.dashboard') }}">
                <i class="bi bi-house-door-fill me-2"></i>
                Dashboard
            </a>
        </div>

        <div class="w-100 py-2 px-3 {% if tab == 'profile' %}active{% endif %}">
            <a class="nav-link primary" href="{{ url_for('shared.profile') }}">
                <i class="bi bi-person-circle me-2"></i>
                Profile
            </a>
        </div>

        <form method="POST" action="{{ url_for('auth.logout') }}"
            onsubmit="return confirm('Are you sure you want to logout?')">
            <button type="submit" class="nav-link btn btn-link py-2 px-3 text-danger">
                <i class="bi bi-box-arrow-right me-2"></i>
                Logout
            </button>
        </form>
    </div>
</aside>
